name: live-starrocks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Start StarRocks 3.5
        run: docker run --detach --name ossie-starrocks-live starrocks/allin1-ubuntu:3.5-latest
      - name: Wait for StarRocks
        run: |
          for attempt in $(seq 1 60); do
            if docker exec ossie-starrocks-live mysql -h 127.0.0.1 -P 9030 -u root -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker logs ossie-starrocks-live
          exit 1
      - name: Run differential tests
        run: python scripts/live_starrocks.py
      - name: Show StarRocks logs on failure
        if: failure()
        run: docker logs ossie-starrocks-live
      - name: Stop StarRocks
        if: always()
        run: docker rm --force ossie-starrocks-live
