name: live-trino

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Start Trino
        run: docker run --detach --name ossie-trino-live -p 8080:8080 trinodb/trino:476
      - name: Wait for Trino
        run: |
          for attempt in $(seq 1 60); do
            if docker exec ossie-trino-live trino --execute 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs ossie-trino-live
          exit 1
      - name: Run differential tests
        run: python scripts/live_trino.py
      - name: Show Trino logs on failure
        if: failure()
        run: docker logs ossie-trino-live
      - name: Stop Trino
        if: always()
        run: docker rm --force ossie-trino-live
